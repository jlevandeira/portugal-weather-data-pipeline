services:
  # 1. Base de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: weather_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-weather_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-weather_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Dashboard Streamlit
  dashboard:
    build: .
    container_name: weather_dashboard
    restart: always
    environment:
      - DB_HOST=postgres       # Usa o nome do serviço postgres dentro da rede Docker!
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-weather_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secret}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Agendador Automático da Pipeline (Corre em background de 60 em 60s)
  scheduler:
    build: .
    container_name: weather_scheduler
    restart: always
    command: python scripts/scheduler.py
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-weather_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secret}
      - SCHEDULE_INTERVAL_SECONDS=60
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: