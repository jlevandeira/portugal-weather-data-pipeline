name: Continuous Integration (CI)

# Executa este fluxo sempre que houver um 'push' ou 'pull request' nas branches principais
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  testes:
    name: Executar Testes com Pytest
    runs-on: ubuntu-latest # Máquina virtual Linux fornecida gratuitamente pelo GitHub

    steps:
      # 1. Faz o checkout (descarrega o código do repositório)
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      # 2. Configura o interpretador de Python 3.10
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # Acelera os builds guardando dependências em cache

      # 3. Instala as dependências do requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Executa a suite de testes automatizada
      - name: Correr Testes com pytest
        run: |
          pytest tests/ -v